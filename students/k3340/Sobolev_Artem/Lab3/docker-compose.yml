services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    ports:
      - "55433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab3-api
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab3-api
    env_file:
      - .env
    ports:
      - "8111:8111"
    depends_on:
      migrations:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8111/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab3-api
    env_file:
      - .env
    command: celery -A celery_app:celery_app worker --loglevel=info
    depends_on:
      migrations:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab3-api
    env_file:
      - .env
    command: celery -A celery_app:celery_app beat --loglevel=info
    depends_on:
      migrations:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
      redis:
        condition: service_healthy

  parser:
    build:
      context: ./parser
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8112:8112"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8112/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
